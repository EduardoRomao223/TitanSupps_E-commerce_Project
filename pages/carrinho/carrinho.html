<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Carrinho - TitanSupps</title>
  <link rel="stylesheet" href="carrinho.css">
  <link rel="stylesheet" href="../../styles.css">
</head>
<body>

  <header class="site-header">
    <div class="wrap header-row">
      <a class="brand" href="../../index.html" aria-label="Titan Supps início"><span class="brand-mark">T</span><span>TITAN<span class="brand-red">SUPPS</span></span></a>
      <nav class="nav-links" aria-label="Menu principal"><a href="../../index.html#inicio">Início</a><a href="../../index.html#produtos">Produtos</a><a href="../sobre/sobre.html">Sobre</a></nav>
      <a class="header-cart active" href="carrinho.html" aria-current="page">Carrinho <span id="cart-count">0</span></a>
      <a class="login-link" href="../login/login.html"><span id="account-label">Entrar</span></a>
    </div>
  </header>

  <main>
    <h1>Meu <span>Carrinho</span> (<span id="contador">0</span> itens)</h1>

    <div class="layout">

      <!-- Lista de produtos -->
      <section class="card" id="lista"></section>

      <!-- Resumo do pedido -->
      <aside class="card resumo" id="resumo">
        <h2>Resumo do pedido</h2>

        <div class="linha"><span>Subtotal</span><span id="subtotal"></span></div>
        <div class="linha desconto" id="linhaDesconto">
          <span>Cupom <b id="nomeCupom"></b></span><span id="valorDesconto"></span>
        </div>
        <div class="linha"><span>Frete</span><span id="frete"></span></div>

        <div class="aviso-frete">
          <span id="msgFrete"></span>
          <div class="barra"><div id="progresso"></div></div>
        </div>

        <div class="cupom">
          <input id="campoCupom" placeholder="Cupom (ex: TITAN10)">
          <button class="btn pequeno" onclick="aplicarCupom()">Aplicar</button>
        </div>
        <p id="msgCupom"></p>

        <div class="linha total"><span>Total</span><b id="total"></b></div>

        <button class="btn" onclick="finalizar()">Finalizar compra</button>
        <button class="btn contorno" onclick="esvaziar()">Esvaziar carrinho</button>
      </aside>

    </div>
  </main>

  <script src="carrinho.js"></script>
  </body>
</html>
