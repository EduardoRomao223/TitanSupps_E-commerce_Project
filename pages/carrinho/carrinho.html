<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carrinho - TitanSupps</title>
  <link rel="stylesheet" href="carrinho.css">
</head>
<body>

  <header>
    <a class="logo" href="/index.html">TITAN<span>SUPPS</span></a>
    <a class="voltar" href="/index.html">Voltar para a Loja</a>
  </header>

  <main>
    <h1>Meu <span>Carrinho</span> (<span id="contador">0</span> itens)</h1>

    <div class="layout">

      <!-- Lista de produtos -->
      <section class="card" id="lista"></section>

      <!-- Resumo do pedido -->
      <aside class="card resumo" id="resumo">
        <h2>Resumo do pedido</h2>

        <div class="linha"><span>Subtotal</span><span id="subtotal"></span></div>
        <div class="linha desconto" id="linhaDesconto">
          <span>Cupom <b id="nomeCupom"></b></span><span id="valorDesconto"></span>
        </div>
        <div class="linha"><span>Frete</span><span id="frete"></span></div>

        <div class="aviso-frete">
          <span id="msgFrete"></span>
          <div class="barra"><div id="progresso"></div></div>
        </div>

        <div class="cupom">
          <input id="campoCupom" placeholder="Cupom (ex: TITAN10)">
          <button class="btn pequeno" onclick="aplicarCupom()">Aplicar</button>
        </div>
        <p id="msgCupom"></p>

        <div class="linha total"><span>Total</span><b id="total"></b></div>

        <button class="btn" onclick="finalizar()">Finalizar compra</button>
        <button class="btn contorno" onclick="esvaziar()">Esvaziar carrinho</button>
      </aside>

    </div>
  </main>

  <script src="carrinho.js"></script>
</body>
</html>
